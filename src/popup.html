<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fet Features</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Fet Features</h1>
    <label class="switch" title="Enable or disable all features">
      <input type="checkbox" id="enabled" />
      <span class="track" aria-hidden="true"></span>
      <span class="switch-label">On</span>
    </label>
  </header>

  <main>
    <h2>Notifications</h2>
    <p class="hint">Hide these notification types:</p>
    <ul>
      <li><label><input type="checkbox" data-notif="like" /> Loves</label></li>
      <li><label><input type="checkbox" data-notif="comment" /> Comments on your content</label></li>
      <li><label><input type="checkbox" data-notif="mention" /> Mentions</label></li>
      <li><label><input type="checkbox" data-notif="follow" /> Follows &amp; follow requests</label></li>
      <li><label><input type="checkbox" data-notif="friend" /> Friend &amp; relationship requests</label></li>
      <li><label><input type="checkbox" data-notif="group" /> Groups &amp; discussions</label></li>
      <li><label><input type="checkbox" data-notif="other" /> Everything else</label></li>
    </ul>

    <h2>Home feed</h2>
    <p class="hint">Loved pictures in the feed:</p>
    <ul role="radiogroup" aria-label="Loved pictures display">
      <li><label><input type="radio" name="pictures" value="hidden" /> Hide thumbnails</label></li>
      <li><label><input type="radio" name="pictures" value="normal" /> Normal size</label></li>
      <li><label><input type="radio" name="pictures" value="large" /> Bigger thumbnails</label></li>
    </ul>

    <h2>Message requests</h2>
    <ul>
      <li><label><input type="checkbox" id="hideMaleRequests" /> Hide requests from men (M)</label></li>
    </ul>
  </main>

  <footer>
    By
    <a href="https://fetlife.com/Annamesoeur" target="_blank" rel="noopener noreferrer">@Annamesoeur</a>
    and
    <a href="https://fetlife.com/kraehe" target="_blank" rel="noopener noreferrer">@kraehe</a><br>
    Unofficial. Not affiliated with BitLove or FetLife.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
